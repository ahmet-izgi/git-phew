[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "git-phew"
version = "0.1.0.dev0"
description = "Tiny tools. Big relief. Small utilities that make Git less painful."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
git-phew = "git_phew.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
